spring.application.name=MyBusiness
# URL de conexión a MySQL (cambia 'localhost', 'puerto' y 'basededatos' según sea necesario)
spring.datasource.url=jdbc:mysql://localhost:3306/testDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuario y contraseña de MySQL
spring.datasource.username=user
spring.datasource.password=user123

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto de Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Estrategia de Hibernate (update/validate/create/create-drop)
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true